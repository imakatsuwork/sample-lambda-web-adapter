name: 'Deploy Lambda Function'
description: 'Build Docker image, push to ECR, and deploy to Lambda'
inputs:
  aws-role-arn:
    description: 'AWS IAM role ARN for OIDC'
    required: true
  aws-region:
    description: 'AWS region'
    required: false
    default: 'ap-northeast-1'
  ecr-repository:
    description: 'ECR repository name'
    required: false
    default: 'sample-lambda-web-adapter'
  function-name:
    description: 'Lambda function name'
    required: true
  environment:
    description: 'Deployment environment (used for NODE_ENV)'
    required: false
    default: 'production'
  image-tag:
    description: 'Docker image tag'
    required: true
  tag-latest:
    description: 'Whether to tag image as environment-latest'
    required: false
    default: 'false'

runs:
  using: 'composite'
  steps:
    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        role-to-assume: ${{ inputs.aws-role-arn }}
        aws-region: ${{ inputs.aws-region }}
    
    - name: Login to Amazon ECR
      id: login-ecr
      uses: aws-actions/amazon-ecr-login@v2
    
    - name: Build, tag, and push image to Amazon ECR
      id: build-image
      shell: bash
      env:
        ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        ECR_REPOSITORY: ${{ inputs.ecr-repository }}
        IMAGE_TAG: ${{ inputs.image-tag }}
      run: |
        docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG .
        docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
        echo "image=$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" >> $GITHUB_OUTPUT
        
    - name: Deploy to Lambda
      uses: aws-actions/aws-lambda-deploy@v2.0.0
      with:
        function-name: ${{ inputs.function-name }}
        image-uri: ${{ steps.build-image.outputs.image }}
        
    - name: Update Lambda function configuration
      shell: bash
      env:
        FUNCTION_NAME: ${{ inputs.function-name }}
        NODE_ENV: ${{ inputs.environment }}
      run: |
        aws lambda update-function-configuration \
          --function-name $FUNCTION_NAME \
          --environment Variables={NODE_ENV=$NODE_ENV} \
          --timeout 30 \
          --memory-size 512
          
    - name: Tag image as latest for environment
      if: inputs.tag-latest == 'true'
      shell: bash
      env:
        ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        ECR_REPOSITORY: ${{ inputs.ecr-repository }}
        IMAGE_TAG: ${{ inputs.image-tag }}
        ENVIRONMENT: ${{ inputs.environment }}
      run: |
        LATEST_TAG="${ENVIRONMENT}-latest"
        docker tag $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG $ECR_REGISTRY/$ECR_REPOSITORY:$LATEST_TAG
        docker push $ECR_REGISTRY/$ECR_REPOSITORY:$LATEST_TAG