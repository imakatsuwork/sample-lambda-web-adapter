name: Manual Deploy

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Deployment environment'
        required: true
        type: choice
        options:
          - staging
          - production
        default: staging

env:
  AWS_REGION: ap-northeast-1

jobs:
  deploy:
    name: Deploy to ${{ github.event.inputs.environment }}
    runs-on: ubuntu-latest
    
    environment: ${{ github.event.inputs.environment }}
    
    permissions:
      id-token: write
      contents: read
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Deploy Lambda Function
        uses: ./.github/actions/deploy-lambda
        with:
          aws-role-arn: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          function-name: sample-lambda-web-adapter-${{ github.event.inputs.environment }}
          environment: ${{ github.event.inputs.environment }}
          image-tag: ${{ github.event.inputs.environment }}-${{ github.sha }}
          tag-latest: 'true'